name: fitto-weekly

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 09:00 Nairobi
  workflow_dispatch:

permissions:
  contents: write # encrypted state on the fitto-state branch

concurrency:
  group: fitto-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Weekly summary (logs show counts only)
        env:
          FITTO_PROFILE: ${{ secrets.FITTO_PROFILE }}
          FITTO_STATE_KEY: ${{ secrets.FITTO_STATE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FITTO_EMAIL_TO: ${{ secrets.FITTO_EMAIL_TO }}
          FITTO_EMAIL_FROM: ${{ vars.FITTO_EMAIL_FROM }}
          FITTO_SITE_URL: ${{ vars.FITTO_SITE_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          if [ -z "$FITTO_PROFILE" ] || [ -z "$FITTO_STATE_KEY" ]; then
            echo "::notice::Dry run (FITTO_PROFILE / FITTO_STATE_KEY not set)"
            export FITTO_DRY_RUN=1
          fi
          pnpm fitto weekly $FORCE