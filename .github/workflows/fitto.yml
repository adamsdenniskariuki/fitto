name: fitto

on:
  schedule:
    - cron: "17 4 * * *" # daily, ~07:17 Nairobi; off the hour because GitHub delays top-of-hour schedules
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (placeholder profile, no state writes, no delivery)"
        type: boolean
        default: false

permissions:
  contents: write # push the encrypted state to the fitto-state branch only

concurrency:
  group: fitto-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Fitto (logs show aggregate counts only)
        env:
          FITTO_PROFILE: ${{ secrets.FITTO_PROFILE }}
          FITTO_STATE_KEY: ${{ secrets.FITTO_STATE_KEY }}
          FITTO_COMPANIES: ${{ secrets.FITTO_COMPANIES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FITTO_LLM: ${{ vars.FITTO_LLM }}
          FITTO_MODEL: ${{ vars.FITTO_MODEL }}
          FITTO_MAX_LLM_CALLS: ${{ vars.FITTO_MAX_LLM_CALLS }}
          FITTO_MAX_DRAFTS: ${{ vars.FITTO_MAX_DRAFTS }}
          TNC_API_TOKEN: ${{ secrets.TNC_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FITTO_EMAIL_TO: ${{ secrets.FITTO_EMAIL_TO }}
          FITTO_EMAIL_FROM: ${{ vars.FITTO_EMAIL_FROM }}
          FITTO_SITE_URL: ${{ vars.FITTO_SITE_URL }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_INPUT" = "true" ] || [ -z "$FITTO_PROFILE" ] || [ -z "$FITTO_STATE_KEY" ]; then
            echo "::notice::Dry run (requested, or FITTO_PROFILE / FITTO_STATE_KEY not set)"
            export FITTO_DRY_RUN=1
          fi
          pnpm fitto run